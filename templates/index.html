<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CamereCurte - Monitorizare</title>
    <style>
        :root {
            --bg-dark: #0f172a;
            --bg-card: #1e293b;
            --accent-green: #22c55e;
            --accent-red: #ef4444;
            --accent-cyan: #06b6d4;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        header {
            background-color: var(--bg-card);
            border-bottom: 1px solid var(--border-color);
            padding: 12px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 65px;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 25px;
        }

        .logo {
            font-weight: bold;
            font-size: 1.1rem;
            letter-spacing: 1px;
            color: var(--text-main);
        }
        .nav-tabs {
            display: flex;
            gap: 20px;
        }

        .nav-tab {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            padding: 6px 12px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
        }

        .nav-tab:hover {
            color: var(--text-main);
            background: rgba(255, 255, 255, 0.03);
        }

        .nav-tab.active {
            color: var(--accent-cyan);
            background: rgba(6, 182, 212, 0.1);
            border-bottom: 2px solid var(--accent-cyan);
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .status-badge {
            background: rgba(34, 197, 94, 0.1);
            color: var(--accent-green);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: var(--accent-green);
            border-radius: 50%;
        }
        .main-content {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
        }
        .view-section {
            display: none;
            grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
            gap: 16px;
        }

        .view-section.active {
            display: grid;
        }

        .camera-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 260px;
        }

        .camera-header {
            padding: 10px 14px;
            font-size: 0.85rem;
            color: var(--text-muted);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            background: rgba(0, 0, 0, 0.2);
        }

        .camera-screen {
            flex: 1;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-muted);
            font-size: 0.9rem;
        }
        .events-table {
            width: 100%;
            border-collapse: collapse;
            background-color: var(--bg-card);
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        .events-table th, .events-table td {
            padding: 12px 16px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
            font-size: 0.9rem;
        }

        .events-table th {
            color: var(--text-muted);
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 0.5px;
            background: rgba(0, 0, 0, 0.2);
        }

        .events-table tr:hover {
            background: rgba(255, 255, 255, 0.02);
        }
        .events-table tbody tr {
            cursor: pointer;
        }

        .events-table tr:hover {
            background: rgba(6, 182, 212, 0.15) !important;
        }
        .camera-card {
            cursor: pointer;
        }
        .camera-card:fullscreen {
        background-color: var(--bg-dark);
        border: none;
        width: 100vw !important;
        height: 100vh !important;
        max-width: none !important;
        max-height: none !important;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        padding: 0;
    }

    .camera-card:-webkit-full-screen {
        background-color: var(--bg-dark);
        width: 100vw !important;
        height: 100vh !important;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
    }
.camera-card.fake-fullscreen {
        position: fixed !important;
        top: 0 !important;
        left: 0 !important;
        width: 100vw !important;
        height: 100vh !important;
        z-index: 99999 !important;
        background-color: var(--bg-dark) !important;
        border: none !important;
        border-radius: 0 !important;
        margin: 0 !important;
        padding: 0 !important;
    }

    .camera-card.fake-fullscreen .camera-screen img {
        width: 100% !important;
        height: 100% !important;
        object-fit: contain !important;
    }

    .camera-card.fake-fullscreen .exit-fullscreen-btn {
        display: block !important;
    }
    .camera-card:fullscreen .camera-screen img,
    .camera-card:-webkit-full-screen .camera-screen img {
        width: 100% !important;
        height: 100% !important;
        object-fit: contain !important;
    }
        .exit-fullscreen-btn {
            display: none;
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(239, 68, 68, 0.8);
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            z-index: 999;
        }
        .camera-card:fullscreen .exit-fullscreen-btn {
            display: block;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-area">
            <div class="logo">🛡️ CamereCurte</div>
            <!-- Butoanele stil tab din designul tău -->
            <div class="nav-tabs">
                <button class="nav-tab active" onclick="switchView('cameras', this)">
                    ◉ CAMERE LIVE
                </button>
                <button class="nav-tab" onclick="switchView('events', this)">
                    ❖ EVENIMENTE SALVATE
                </button>
            </div>
        </div>
        <div class="header-right">
            <div class="status-badge" id="storage-status">
                <div class="status-dot"></div>
                Verificare stocare...
            </div>
            <div id="clock" style="font-size: 0.9rem; color: var(--text-muted);"></div>
        </div>
    </header>

    <div class="main-content">
        <div id="section-cameras" class="view-section active">
            <div style="color: var(--text-muted);">Se încarcă camerele...</div>
        </div>
        <div id="section-events" class="view-section" style="display: none;">
            <table class="events-table">
                <thead>
                    <tr>
                        <th>ID Eveniment</th>
                        <th>Dată & Oră</th>
                        <th>Cameră</th>
                        <th>Descriere / Status</th>
                    </tr>
                </thead>
                <tbody id="events-table-body">
                    <tr>
                        <td colspan="4" style="color: var(--text-muted); text-align: center;">Se încarcă evenimentele...</td>
                    </tr>
                </tbody>
            </table>
        </div>

    </div>

    <script>
        function switchView(viewName, buttonElement) {
            document.querySelectorAll('.view-section').forEach(sec => {
                sec.style.display = 'none';
                sec.classList.remove('active');
            });
            document.querySelectorAll('.nav-tab').forEach(tab => {
                tab.classList.remove('active');
            });
            if (viewName === 'cameras') {
                const sec = document.getElementById('section-cameras');
                sec.style.display = 'grid';
                sec.classList.add('active');
            } else if (viewName === 'events') {
                const sec = document.getElementById('section-events');
                sec.style.display = 'block';
                sec.classList.add('active');
                fetchEvents();
            }
            buttonElement.classList.add('active');
        }

        function toggleFullscreen(cardElement) {
            if (cardElement.classList.contains('fake-fullscreen')) {
                cardElement.classList.remove('fake-fullscreen');
                document.body.style.overflow = 'auto';
            } else {
                cardElement.classList.add('fake-fullscreen');
                document.body.style.overflow = 'hidden';
            }
        }

        function exitFullscreen(event) {
            event.stopPropagation();
            const activeCard = document.querySelector('.camera-card.fake-fullscreen');
            if (activeCard) {
                activeCard.classList.remove('fake-fullscreen');
                document.body.style.overflow = 'auto';
            }
        }

        function updateClock() {
            const now = new Date();
            const dateStr = now.toLocaleDateString('ro-RO', { day: '2-digit', month: 'short', year: 'numeric' });
            const timeStr = now.toLocaleTimeString('ro-RO', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            document.getElementById('clock').innerText = `${dateStr} | ${timeStr}`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        function fetchCameras() {
            fetch('/api/cameras') 
                .then(response => response.json())
                .then(cameras => {
                    const grid = document.getElementById('section-cameras');
                    grid.innerHTML = '';

                    cameras.forEach(cam => {
                        const isLive = cam.activa === true;
                        const statusColor = isLive ? 'var(--accent-green)' : 'var(--accent-red)';
                        const statusText = isLive ? '● LIVE' : '✕ INACTIV';
                        const acum = new Date().toLocaleDateString('ro-RO');

                        const card = document.createElement('div');
                        card.className = 'camera-card';
                        card.onclick = () => toggleFullscreen(card);

                        card.innerHTML = `
                            <button class="exit-fullscreen-btn" onclick="exitFullscreen(event)">✕ Închide Fullscreen</button>
                            <div class="camera-header">
                                <span><b>${cam.nume}</b></span>
                                <span style="font-size: 0.8rem; color: var(--text-muted);">${acum}</span>
                                <span style="color: ${statusColor}; font-weight: bold;">${statusText}</span>
                            </div>
                            <div class="camera-screen">
                                ${isLive ? `<img src="/video_feed/${cam.id}" style="width:100%; height:100%; object-fit:cover;">` : 'Semnal Pierdut / Inactiv'}
                            </div>
                        `;
                        grid.appendChild(card);
                    });
                })
                .catch(error => {
                    console.log("Eroare la preluarea camerelor");
                });
        }

        function fetchEvents() {
            fetch('/api/events')
                .then(response => response.json())
                .then(events => {
                    const tbody = document.getElementById('events-table-body');
                    tbody.innerHTML = '';

                    if (events.length === 0) {
                        tbody.innerHTML = '<tr><td colspan="4" style="text-align: center; color: var(--text-muted);">Nu există evenimente înregistrate momentan.</td></tr>';
                        return;
                    }

                    events.forEach(ev => {
                        const row = document.createElement('tr');
                        const areVideo = ev.fisier ? true : false;
                        
                        if (areVideo) {
                            row.onclick = () => redaVideo(ev.fisier);
                        } else {
                            row.onclick = () => alert("Fișierul video lipsește pentru acest eveniment.");
                            row.style.cursor = "not-allowed";
                        }

                        row.innerHTML = `
                            <td><b>${ev.id || 'EVT-0000'}</b></td>
                            <td>${ev.data || 'N/A'}</td>
                            <td><span style="background: rgba(255,255,255,0.05); padding: 3px 8px; border-radius: 4px;">${ev.camera || 'Cameră necunoscută'}</span></td>
                            <td>${ev.descriere || 'Mișcare detectată'} ${areVideo ? '<span style="float: right; color: var(--accent-cyan); font-size: 0.8rem;">▶ Redă</span>' : ''}</td>
                        `;
                        tbody.appendChild(row);
                    });
                })
                .catch(err => {
                    console.log("Eroare la preluarea evenimentelor");
                });
        }

        function redaVideo(numeFisier) {
            let modal = document.getElementById('videoModal');
            if (!modal) {
                // Generăm modalul dinamic dacă lipsește în HTML
                const modalHtml = `
                    <div id="videoModal" style="display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.85); z-index: 99999; justify-content: center; align-items: center; flex-direction: column;">
                        <div style="width: 90%; max-width: 700px; background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 8px; overflow: hidden; padding: 15px;">
                            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                                <h3 style="color: var(--text-main); font-size: 1rem;">Redare Înregistrare Eveniment</h3>
                                <button onclick="inchideVideo()" style="background: var(--accent-red); color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-weight: bold;">✕ Închide</button>
                            </div>
                            <video id="modalVideoPlayer" controls autoplay style="width: 100%; max-height: 70vh; background: #000; border-radius: 4px;"></video>
                        </div>
                    </div>`;
                document.body.insertAdjacentHTML('beforeend', modalHtml);
                modal = document.getElementById('videoModal');
            }
            const player = document.getElementById('modalVideoPlayer');
            player.src = `/video/${numeFisier}`;
            modal.style.display = 'flex';
            player.play();
        }

        function inchideVideo() {
            const modal = document.getElementById('videoModal');
            const player = document.getElementById('modalVideoPlayer');
            if (player) {
                player.pause();
                player.src = '';
            }
            if (modal) {
                modal.style.display = 'none';
            }
        }
        fetchCameras();
    </script>
</body>
</html>
